app:
  # Same as backend.baseUrl — the app-backend plugin serves the frontend from the backend (one origin).
  baseUrl: https://backstage.aws.refplat.org

backend:
  # The browser-facing URL of the backend. Served behind the Cilium Gateway / internal NLB at this host
  # (Tailscale-only; see the platform gateway-config). TLS is terminated at the gateway, not here.
  baseUrl: https://backstage.aws.refplat.org
  # Bind all interfaces on 7007 (object form — Backstage 1.51's backend rejects the ':7007' string form).
  listen:
    host: 0.0.0.0
    port: 7007
  # The frontend and backend share this origin, so CORS only needs the public URL.
  cors:
    origin: https://backstage.aws.refplat.org
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  # Production sign-in is direct OIDC against Keycloak (the platform IdP of record). Keycloak issues refresh
  # tokens, so Backstage's silent /refresh on reload succeeds and the session survives reloads — no fronting
  # proxy needed. (Was Backstage → oauth2-proxy → Keycloak, itself a workaround for SAML/Dex's missing refresh
  # token, #202; the move to Keycloak OIDC retired both Dex and oauth2-proxy. See packages/app/src/modules/auth
  # and docs/architecture/identity-and-sso.md in the platform repo.)
  # Guest is deliberately absent here and from the base config — see app-config.yaml.
  environment: production
  providers:
    oidc:
      production:
        # Keycloak realm discovery. The backend resolves this host in-cluster via a hostAliases entry to the
        # gateway ClusterIP (platform backstage module); the browser reaches it over Tailscale. clientId +
        # secret are the `backstage` confidential client provisioned by keycloak-config (secret synced from
        # Secrets Manager platform/keycloak/backstage-oidc → OIDC_CLIENT_SECRET).
        metadataUrl: https://keycloak.aws.refplat.org/realms/platform/.well-known/openid-configuration
        clientId: backstage
        clientSecret: ${OIDC_CLIENT_SECRET}
        prompt: auto
        # Sign-in is handled by the custom resolver in packages/backend/src/authOidcModule.ts (it reads the
        # Keycloak `groups` claim and attaches ownershipEntityRefs for RBAC, #197). A code-supplied
        # signInResolver is authoritative, so a declarative `signIn.resolvers` block here would be ignored.
        # The resolver still issues an identity straight from the email claim without requiring a catalog
        # User entity (login-only until ADR-049 projects catalog Users).

# Keycloak RP-initiated logout (end-session) endpoint for the `platform` realm. The sidebar "Sign out" control
# (frontend-visible config; see packages/app/config.d.ts + modules/auth) redirects here so logging out of
# Backstage also ends the Keycloak SSO session — otherwise the SignInPage's `auto` silently re-authenticates
# against the live Keycloak cookie. The browser reaches Keycloak over Tailscale (same host it already hits for
# the OIDC authorize redirect). The `backstage` Keycloak client must allow backstage.aws.refplat.org as a
# post-logout redirect URI (keycloak-config in the platform repo).
signOut:
  keycloakLogoutUrl: https://keycloak.aws.refplat.org/realms/platform/protocol/openid-connect/logout

integrations:
  github:
    # Two GitHub Apps; Backstage picks per request. ORDER IS LOAD-BEARING: org-level (repo-less) credential
    # lookups — the catalog org discovery provider — always take the FIRST app's token, so the read-only
    # discovery App must stay first. Repo-scoped lookups (file reads, PR creation) take the first app whose
    # INSTALLATION covers the repo, so the two installations must stay disjoint (read App: the catalog repos;
    # write App: asanexample/platform only). See the platform repo's
    # docs/runbooks/backstage-scaffolder-github-app.md.
    - host: github.com
      apps:
        # Read-only App for catalog discovery (asanexample org, app-alpha/app-bravo/backstage).
        # Replaces the base config's ${GITHUB_TOKEN} (arrays replace on config merge). appId + private key
        # come from platform/backstage/github-app via ExternalSecret -> env. See docs/runbooks/backstage-github-app.md.
        - appId: ${GITHUB_APP_ID}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          # Backstage's integration schema requires clientId+clientSecret, but installation-token catalog
          # discovery never uses them (they're OAuth/sign-in creds). This App is discovery-only — placeholders
          # rather than minting a real, unused OAuth client secret.
          clientId: discovery-only-unused
          clientSecret: discovery-only-unused
        # Scaffolder WRITE App (BACK Phase 3, ADR-062 §5): Contents + Pull Requests read/write, installed on
        # ONLY asanexample/platform — the repo self-service templates open PRs against. Never widen the read
        # App instead. Credential from platform/backstage/scaffolder-github-app via ExternalSecret -> env
        # (infra/modules/backstage, enable_scaffolder).
        - appId: ${SCAFFOLDER_GITHUB_APP_ID}
          privateKey: ${SCAFFOLDER_GITHUB_APP_PRIVATE_KEY}
          clientId: scaffolder-unused
          clientSecret: scaffolder-unused

catalog:
  # Replaces the scaffold's example locations (demo data). The example `guest` User is gone too — the OIDC
  # sign-in resolver needs no catalog User (dangerouslyAllowSignInWithoutUserInCatalog).
  #
  # Anti-spoofing, scoped by location TYPE (rules are OR across matching rules; a per-location exact-target
  # matcher doesn't match the resolved path, so we key on type instead):
  #   - trusted in-image `file` locations (the seed `platform` Group) may register org entities;
  #   - the platform repo (`url` matching the platform-projection plugin's source) may register the projected
  #     Groups/Systems/Resources — belt-and-suspenders: provider roots bypass the rule check, but if a future
  #     Backstage tightens that, this keeps the projection working;
  #   - everything else (github `url` discovery = untrusted app self-assertion) is Components-only, so app
  #     repos can't inject a Group/System/User or forge ownership.
  rules:
    - allow: [Group, User, Location]
      locations:
        - type: file
    #   - the platform repo may additionally register Templates (BACK Phase 3, ADR-062): scaffolder templates
    #     are platform-authored + CODEOWNERS-protected there (scaffolder/templates/); app repos must NOT be
    #     able to self-register a Template (it defines what a self-service run can do), and the
    #     Components-only rule below keeps it that way.
    - allow: [Group, System, Resource, Location, Template]
      locations:
        - type: url
          pattern: '**asanexample/platform**'
    - allow: [Component, Location]
  locations:
    # Seed `platform` Group (the platform team — not a tenant, so not projected). Baked into the image
    # (Dockerfile COPY catalog). The team Groups (alpha/bravo) come from the platform-projection plugin.
    - type: file
      target: ./catalog/org.yaml
    # Scaffolder templates (BACK Phase 3, ADR-062): the platform repo's platform-owned, CODEOWNERS-protected
    # template tree. Allowed by the asanexample/platform url rule above (Template). Read via whichever GitHub
    # App covers the platform repo (the write App once the read App's installation is shrunk — see the
    # platform repo's docs/runbooks/backstage-scaffolder-github-app.md).
    - type: url
      target: https://github.com/asanexample/platform/blob/main/scaffolder/templates/location.yaml
  providers:
    github:
      asanexample:
        organization: asanexample
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
          # Scope discovery to our repos even if the App is later installed more broadly.
          repository: '^(app-alpha|app-bravo|backstage)$'
        schedule:
          frequency: { minutes: 10 }
          timeout: { minutes: 3 }

# Platform projection plugin (Phase 2.3a) — reads the platform repo's XTenant claims (via the read-only
# GitHub App) and projects Groups/Systems/Resources (ADR-049). repoUrl/claimsPath/branch default to the
# asanexample/platform main gitops/tenant-claims tree; ecrRegistry (optional) is the platform-account ECR
# registry host — when set, the projection emits the per-team restrict-images Kyverno Resource and renders
# ECR Resource titles as the full registry path. See plugins/platform-projection.
platformProjection:
  ecrRegistry: 829808296602.dkr.ecr.us-east-1.amazonaws.com
