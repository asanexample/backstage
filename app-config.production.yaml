app:
  # Same as backend.baseUrl — the app-backend plugin serves the frontend from the backend (one origin).
  baseUrl: https://backstage.aws.refplat.org

backend:
  # The browser-facing URL of the backend. Served behind the Cilium Gateway / internal NLB at this host
  # (Tailscale-only; see the platform gateway-config). TLS is terminated at the gateway, not here.
  baseUrl: https://backstage.aws.refplat.org
  # Bind all interfaces on 7007 (object form — Backstage 1.51's backend rejects the ':7007' string form).
  listen:
    host: 0.0.0.0
    port: 7007
  # The frontend and backend share this origin, so CORS only needs the public URL.
  cors:
    origin: https://backstage.aws.refplat.org
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  # Production sign-in is OIDC against the platform Dex broker (Identity Center → Dex → Backstage).
  # `environment: production` selects the `production` key under each provider below and is the
  # environment the frontend OAuth2 API requests (see packages/app/src/modules/auth). Guest is
  # deliberately absent here and from the base config — see app-config.yaml.
  environment: production
  providers:
    oidc:
      production:
        # Dex's OIDC discovery document. Dex is the centralized SAML→OIDC broker; see
        # docs/runbooks/dex-sso.md and infra/modules/dex in the platform repo.
        metadataUrl: https://sso.aws.refplat.org/.well-known/openid-configuration
        clientId: backstage
        # Injected by the deployment from the platform/backstage/oidc Secrets Manager secret
        # (ExternalSecret → K8s Secret → OIDC_CLIENT_SECRET env). Shared with Dex's staticClient.
        clientSecret: ${OIDC_CLIENT_SECRET}
        prompt: auto
        # Phase 2.1 is login-only: issue a Backstage identity straight from the email claim
        # without requiring a matching catalog User entity (no catalog Users/Groups until 2.3).
        # Group-based admin RBAC is a deferred follow-up (needs the permission framework).
        signIn:
          resolvers:
            - resolver: emailLocalPartMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

integrations:
  github:
    # Read-only GitHub App for catalog discovery (asanexample org, app-alpha/app-bravo/backstage).
    # Replaces the base config's ${GITHUB_TOKEN} (arrays replace on config merge). appId + private key
    # come from platform/backstage/github-app via ExternalSecret -> env. See docs/runbooks/backstage-github-app.md.
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}

catalog:
  # Replaces the scaffold's example locations (demo data). The example `guest` User is gone too — the OIDC
  # sign-in resolver needs no catalog User (dangerouslyAllowSignInWithoutUserInCatalog).
  #
  # Anti-spoofing: discovered app-repo catalog-info.yaml may only register Components (+ Location). App repos
  # are untrusted self-assertions, so they can't inject a Group/System/User or forge ownership. The seed Groups
  # below come from a trusted in-image file that explicitly allows Group. Authoritative ownership is the 2.3
  # git-projection.
  rules:
    - allow: [Component, Location]
  locations:
    # Seed Group entities (alpha/bravo/platform) so Components resolve to a real owner. Baked into the image
    # (Dockerfile COPY catalog). Superseded by the 2.3 projection (Identity Center groups + ADR-049 envelope).
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [Group]
  providers:
    github:
      asanexample:
        organization: asanexample
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
          # Scope discovery to our repos even if the App is later installed more broadly.
          repository: '^(app-alpha|app-bravo|backstage)$'
        schedule:
          frequency: { minutes: 10 }
          timeout: { minutes: 3 }
