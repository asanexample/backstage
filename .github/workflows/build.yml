name: Build image

# Builds the Backstage backend image (host build per packages/backend/Dockerfile) and pushes it, cosign-signed
# + SBOM'd, to the PLATFORM ECR repo platform/backstage. Backstage is platform infra (not a tenant app), so it
# uses this dedicated platform pipeline, not the tenant trusted-ci/build-sign chain — but it is still signed,
# because the portal is a higher-value target than the tenants it governs (ADR-051 / supply-chain posture).

on:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC: AWS (ECR push) + cosign keyless signing
  contents: read

env:
  ECR_REGISTRY: 829808296602.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: platform/backstage

jobs:
  build:
    # Native arm64 runner: the platform runs on Graviton/t4g nodes, so the image must be arm64. The whole job
    # must be arm64 (not just the docker build) because the backend is built on the host first — `yarn install`
    # compiles native node modules for the runner's arch, and they're packaged into the image as-is.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install + build the backend (host build)
        run: |
          # Invoke the committed yarn binary DIRECTLY (yarnPath: .yarn/releases/yarn-4.4.1.cjs). Do NOT use
          # `corepack enable`: on the arm64 runner corepack ignores yarnPath and tries to DOWNLOAD yarn 4.4.1,
          # which (even with the prompt disabled) left the install/build as a <1s no-op — so
          # packages/backend/dist/{bundle,skeleton}.tar.gz were never produced and the Docker COPY failed
          # ("not found"), leaving the ECR repo empty. Direct invocation needs no network + is deterministic.
          # set -x + the final ls turn a build failure into a loud error here instead of a missing-artifact
          # failure two steps later in the Docker build.
          set -euxo pipefail
          YARN="node .yarn/releases/yarn-4.4.1.cjs"
          $YARN install --immutable
          $YARN tsc
          $YARN build:backend
          ls -la packages/backend/dist/bundle.tar.gz packages/backend/dist/skeleton.tar.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::829808296602:role/github-actions-ecr-push-backstage
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          platforms: linux/arm64 # arm64-only — the platform is all-Graviton (native build on the arm64 runner)
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.5.2"

      - name: Sign image (cosign keyless)
        run: cosign sign --yes "${ECR_REGISTRY}/${ECR_REPO}@${{ steps.build.outputs.digest }}"

      - name: Install Syft (download release binary + verify SHA-256)
        env:
          SYFT_VERSION: "1.44.0"
        run: |
          set -euo pipefail
          # Match the runner arch — this job runs on a native arm64 runner (ubuntu-24.04-arm), so a hardcoded
          # amd64 binary fails with "Exec format error".
          case "$(uname -m)" in
            x86_64) goarch=amd64 ;;
            aarch64 | arm64) goarch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          asset="syft_${SYFT_VERSION}_linux_${goarch}.tar.gz"
          curl -sfL "${base}/${asset}" -o "${asset}"
          curl -sfL "${base}/syft_${SYFT_VERSION}_checksums.txt" -o syft_checksums.txt
          grep " ${asset}\$" syft_checksums.txt | sha256sum -c -
          tar xzf "${asset}" syft && sudo install -m 0755 syft /usr/local/bin/syft

      - name: Generate + attest SBOM (CycloneDX, cosign keyless)
        env:
          REF: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          syft "$REF" -o cyclonedx-json=sbom.cdx.json
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
