# Seed Group entities (Phase 2.2) — now reduced to just `platform`.
#
# The team Groups (alpha/bravo) are projected from the XTenant claims by the platform-projection plugin
# (Phase 2.3a), so they're removed from here. `platform` is NOT a tenant (it has no XTenant claim) — it's the
# platform team that owns platform-internal Components like the portal itself — so it stays seeded.
# Loaded via a trusted file location in app-config.production.yaml that allows the Group kind.
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform
  description: Platform team (owns platform-internal components like the portal itself)
spec:
  type: team
  children: []
