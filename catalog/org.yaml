# Seed Group entities so catalog Components resolve to a real owner (Phase 2.2).
#
# These are MINIMAL and a stop-gap. The Phase 2.3 projection plugin supersedes them with
# Identity-Center-sourced Groups carrying the ADR-049 envelope fields (allowedTiers/allowedZones/quota).
# Baked into the image (packages/backend/Dockerfile COPY catalog) and loaded via a trusted file location
# in app-config.production.yaml that explicitly allows the Group kind.
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: alpha
  description: Team alpha
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: bravo
  description: Team bravo
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform
  description: Platform team (owns platform-internal components like the portal itself)
spec:
  type: team
  children: []
